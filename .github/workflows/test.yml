name: Test Project

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend-1
            path: ./Application/backend/first-app
            node: 22

          - name: backend-2
            path: ./Application/backend/second-app
            node: 22

          - name: frontend-1
            path: ./Application/frontend/first-app
            node: 22

          - name: frontend-2
            path: ./Application/frontend/second-app
            node: 22

          - name: frontend-3
            path: ./Application/frontend/third-app
            node: 22

    name: Test ${{ matrix.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.path }}
        run: npm ci

      - name: Lint
        working-directory: ${{ matrix.path }}
        run: npm run lint

      - name: Unit tests
        working-directory: ${{ matrix.path }}
        run: npm test

      - name: Build
        working-directory: ${{ matrix.path }}
        run: npm run build