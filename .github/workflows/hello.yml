name: Build Project

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.SECRET_MY }}
      
      - name: Convert owner to lowercase
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Docker version
        run: docker --version

      - name: Docker Compose version
        run: docker compose version

      - name: Network create
        run: docker network create frontend-network || true && docker network create backend-network || true && docker network create infrastructure-network || true

      - name: Network Check
        run: docker network ls

      - name: Build and Push Backend 1
        uses: docker/build-push-action@v6
        with:
          context: ./Application/backend/first-app
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/backend-1:latest
