apiVersion: apps/v1
kind: Deployment
metadata:
  name: first-f-app
  labels:
    app: first-f-app

spec:
  replicas: 1
  template:
    metadata:
      labels:
        app: first-f-app
    
    spec:
      containers:
        - name: first-f-app
          image: ghcr.io/fialdi/frontend-1:sha-668e3fb
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

  selector:
    matchLabels:
      app: first-f-app
