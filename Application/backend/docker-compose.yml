services:
  backend-1:
    build: ./first-app
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - MONGO_URI=mongodb://root:rootpassword@mongodb:27017/?authSource=admin
      - MONGO_DB_NAME=mydatabase
    networks:
      - backend-network
      - infrastructure-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3001"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  
  backend-2:
    build: ./second-app
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DATABASE_URL=postgresql://myuser:mypass@postgres:5432/mydb
    networks:
      - backend-network
      - infrastructure-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3002"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  backend-network:
    external: true
    name: backend-network
  
  infrastructure-network:
    external: true
    name: infrastructure-network