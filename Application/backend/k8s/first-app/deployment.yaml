apiVersion: apps/v1
kind: Deployment
metadata:
  name: first-app
  labels:
    app: first-app

spec:
  replicas: 1
  template:
    metadata:
      labels:
        app: first-app
    
    spec:
      containers:
        - name: first-app
          image: ghcr.io/fialdi/backend-1:sha-668e3fb
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: app-config

            - secretRef:
                name: app-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

  selector:
    matchLabels:
      app: first-app
