services:
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: 
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend-network
      - backend-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://127.0.0.1/1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  frontend-network:
    external: true
    name: frontend-network
  backend-network:
    external: true
    name: backend-network