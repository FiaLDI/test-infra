services:
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: 
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend-network
      - backend-network

networks:
  frontend-network:
    external: true
    name: frontend-network
  backend-network:
    external: true
    name: backend-network